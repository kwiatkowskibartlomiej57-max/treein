<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Training</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--txt:#eef0f4;--mut:#8b93a3;--acc:#4cc38a;--accd:#12392a;--warn:#f5a623;--bad:#ef5b5b;--blue:#4aa8ff;--gold:#ffd166;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 96px)}
body.withtimer{padding-bottom:calc(env(safe-area-inset-bottom) + 160px)}
h1{font-size:26px;margin:6px 0 2px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:17px;margin:0}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
button,.btn{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.3}
button.pri{background:var(--acc);color:#06210f;border:0;font-weight:700}
button.danger{color:var(--bad)}
button.sm{min-height:38px;padding:8px 12px;font-size:14px}
button.ghost{background:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sess{padding:16px 12px;text-align:left;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sess b{display:block;font-size:18px}
.sess span{color:var(--mut);font-size:13px}
.sess.today{border-color:var(--acc);background:var(--accd)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px}
.seg button.on{background:var(--acc);color:#06210f;font-weight:700}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mut);margin:6px 6px 0 0}
.pill.fail{color:var(--warn);border-color:#5b4515}
.pill.rir{color:#7cc4ff;border-color:#1d4466}
.pill.pr{color:var(--gold);border-color:#6b5a1d}
.last{color:var(--mut);font-size:13px;margin:8px 0 0}
.goal{font-size:14px;margin:6px 0 0;color:#bfe8d2}
.goal b{color:var(--acc)}
.inputs{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.inputs label{flex:1;min-width:52px;font-size:12px;color:var(--mut);display:block}
input,select{font:inherit;font-size:17px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;width:100%;text-align:center;min-height:46px}
input[type=date]{text-align:left;padding:10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0}
input.l{text-align:left;padding:10px}
select{text-align:left;padding:10px 30px 10px 10px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 12px) 52%;background-size:6px 6px;background-repeat:no-repeat}
textarea{font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:70px}
label.fld{display:block;margin-top:10px;flex:1}
.row label.fld{min-width:0}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.chk input{width:24px;min-height:24px;height:24px;flex:none;accent-color:var(--acc)}
.hint{margin-top:10px;font-weight:700;font-size:14px;min-height:0}
.hint.up{color:var(--acc)}
.hint.rep{color:var(--warn)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tip{margin-top:10px;padding:10px;background:var(--card2);border-radius:10px;font-size:14px}
.tip a{color:#7cc4ff;display:block;padding:6px 0}
.tip table td{border:0;padding:3px 6px 3px 0}
.hidden{display:none}
.banner{background:#3a2d0c;border:1px solid #6b5316;color:#ffd98a;border-radius:12px;padding:12px;margin:0 0 12px;font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .2s}
.big{font-size:34px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(24,27,34,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;font-size:11px;color:var(--mut);min-height:52px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--acc)}
.timer{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 70px);background:var(--accd);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:6}
.timer b{font-size:24px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);background:#000;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.week{display:flex;gap:6px;margin:4px 0 14px}
.week i{flex:1;height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.week i.on{background:var(--acc);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--mut)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg.chart text{fill:var(--mut);font-size:10px}
.scale{display:grid;gap:4px;margin-top:8px}
.scale button{min-height:38px;padding:0;font-size:14px;border-radius:8px;min-width:0}
.scale button.on{background:var(--acc);color:#06210f;border-color:var(--acc);font-weight:700}
.scale button.on.mid{background:var(--warn);border-color:var(--warn)}
.scale button.on.hi{background:var(--bad);border-color:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;padding:6px 11px;font-size:14px;border-radius:99px}
.chip.p1{background:var(--acc);color:#06210f;border-color:var(--acc);font-weight:700}
.chip.p05{background:var(--accd);color:var(--acc);border-color:var(--acc)}
.pill.stall{color:var(--bad);border-color:#5b2525}
.pill.dl{color:#c9a7ff;border-color:#45306b}
.banner.bad{background:#3a1515;border-color:#6b2525;color:#ffb3b3}
.banner.dl{background:#241a38;border-color:#45306b;color:#dccbff}
.banner.info{background:var(--card2);border-color:var(--line);color:var(--txt)}
.stalltxt{font-size:13px;color:#ffb3b3;margin:6px 0 0}
.mtab td,.mtab th{font-size:13px;padding:5px 3px}
.mtab th{color:var(--mut);font-weight:600}
.lo{color:var(--warn);font-weight:700}.ok{color:var(--acc);font-weight:700}.hi{color:var(--blue);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="timerbox"></div>
<nav class="tabs" id="tabs"></nav>

<script>
'use strict';
/* ====== PLAN DOMYŚLNY (zmieniasz go w aplikacji: zakładka Plan) ====== */
const ytUrl = q => /^https?:\/\//i.test(q) ? q : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(String(q).replace(/\+/g, ' '));
const E = (id, n, h, s, lo, hi, o = {}) => ({id, n, h, s, r: [lo, hi], unit: o.unit || 'powt.', mode: o.mode || '', noW: !!o.noW, rest: o.rest || 90, tip: o.tip || '', yt: o.yt || []});
const FAIL_TIP = 'Serie 1–2 z zapasem 1–2 powtórzeń, ostatnia seria do upadku (maszyna jest podparta).';
const DEFAULT_PLAN = {
  gA: {name: 'Góra A', day: 1, ex: [
    E('gA1', 'Chest press (maszyna)', 'Wyciskanie sztangi płaskie', 3, 6, 10, {mode: 'fail', rest: 180, tip: 'Łopatki ściągnięte, stopy na podłodze. ' + FAIL_TIP, yt: ['chest+press+maszyna+technika']}),
    E('gA2', 'Lat pulldown, chwyt szeroki', 'Ściąganie gumy z góry, chwyt szeroki', 3, 8, 12, {mode: 'fail', rest: 180, tip: 'Ściągasz drążek do górnej części klatki, łokcie w dół, bez bujania tułowiem. Serie 1–2 z zapasem 1–2 powtórzeń, ostatnia do upadku.', yt: ['sciaganie+drazka+wyciagu+gornego+technika']}),
    E('gA3', 'Shoulder press (maszyna, plecy przy oparciu)', 'Wyciskanie hantli nad głowę siedząc (z oparciem)', 2, 8, 12, {mode: 'rir', rest: 150, tip: 'Plecy zawsze przy oparciu, bez wyginania w łuk. Zapas 1-2 powtórzeń.', yt: ['shoulder+press+maszyna+technika']}),
    E('gA4', 'Chest-supported row (maszyna z oparciem klatki)', 'Wiosłowanie hantlem jednorącz', 2, 8, 12, {mode: 'rir', rest: 150, tip: 'Klatka na oparciu = zero obciążenia lędźwi. Technika ważniejsza niż upadek: zapas 1-2 powtórzeń.', yt: ['wioslowanie+na+maszynie+z+oparciem+klatki']}),
    E('gA5', 'Modlitewnik / uginanie ramion na wyciągu dolnym', 'Uginanie hantli na biceps', 3, 10, 12, {tip: 'Łokcie przy tułowiu, powoli w dół.', yt: ['uginanie+ramion+wyciag+dolny+technika']}),
    E('gA6', 'Prostowanie ramion nad głową z liną (wyciąg)', 'Francuskie wyciskanie', 3, 10, 12, {tip: 'Najbezpieczniej siedząc na ławce z oparciem pleców. Nie wyginaj lędźwi: żebra w dół, brzuch napięty. Jeśli plecy się wyginają albo czujesz mrowienie, zamień na triceps z wyciągu z góry (drążek / lina).', yt: ['prostowanie+ramion+nad+glowa+lina+wyciag+technika', 'triceps+wyciag+prosty+drazek+technika']}),
    E('robak', 'Martwy robak (na stronę)', 'Martwy robak (na stronę)', 2, 10, 12, {noW: true, rest: 60, tip: 'Lędźwie przy podłodze, ruch powoli. Jeśli plecy odrywają się od podłoża, skróć ruch.', yt: ['dead+bug+technika']}),
    E('pallof', 'Pallof press na wyciągu (na stronę)', 'Pallof press z gumą', 3, 10, 12, {rest: 60, tip: 'Antyrotacja: tułów się nie skręca. Ciężar dokładasz talerzem.', yt: ['pallof+press+wyciag+technika']}),
    E('gA9', 'Reverse crunch na ławce', 'Reverse crunch na podłodze', 3, 10, 15, {noW: true, rest: 60, tip: 'Mały ruch, miednica PODWINIĘTA, bez rzucania nóg. Zacznij bardzo lekko i najpierw pokaż fizjoterapeucie. Mrowienie lub promieniowanie w nogę = odpuść.', yt: ['reverse+crunch+technika']})
  ]},
  dA: {name: 'Dół A', day: 2, ex: [
    E('dA1', 'Leg press', 'Goblet squat', 3, 8, 12, {mode: 'rir', rest: 180, tip: 'Miednica NIE odrywa się od oparcia, nie schodź głębiej niż przed podwinięciem miednicy. Zapas 1-2 powtórzeń.', yt: ['leg+press+technika']}),
    E('dA2', 'Hip thrust (maszyna / smith)', 'Hip thrust z hantlem', 3, 8, 12, {mode: 'rir', rest: 150, tip: 'Pauza 2 s na górze, miednica PODWINIĘTA, broda do klatki.', yt: ['hip+thrust+maszyna+technika']}),
    E('dA3', 'Leg extension (maszyna)', 'Wykroki z hantlami (na nogę)', 3, 10, 15, {mode: 'fail', rest: 90, tip: 'Maszyna z podparciem: ostatnia seria może być do upadku.', yt: ['leg+extension+maszyna+technika']}),
    E('legcurl', 'Uginanie nóg na maszynie siedząc', 'Unoszenie bioder jednonóż', 3, 10, 15, {tip: 'Siedząc, nie leżąc: leżąc łatwo wyginasz lędźwie.', yt: ['uginanie+nog+siedzac+maszyna+technika']}),
    E('sideplank', 'Side plank (sekundy na stronę)', 'Side plank', 3, 20, 30, {unit: 's', noW: true, rest: 60, tip: 'Ciało w jednej linii od głowy do stóp, biodro nie opada. Progres: z kolan na proste nogi.', yt: ['side+plank+technika']})
  ]},
  gB: {name: 'Góra B', day: 4, ex: [
    E('gB1', 'Incline chest press (maszyna, górna klatka)', 'Wyciskanie hantli na skosie', 3, 8, 12, {mode: 'fail', rest: 180, tip: FAIL_TIP, yt: ['incline+chest+press+maszyna+technika']}),
    E('gB2', 'Wiosłowanie na maszynie z oparciem klatki / T-bar z podparciem', 'Wiosłowanie w podporze na skosie', 3, 8, 12, {mode: 'rir', rest: 150, tip: 'Zero obciążenia lędźwi dzięki podparciu klatki. Zapas 1-2 powtórzeń.', yt: ['wioslowanie+na+maszynie+z+oparciem+klatki', 't-bar+row+chest+supported+technika']}),
    E('gB3', 'Lat pulldown, chwyt neutralny (V-bar) / podchwyt', 'Ściąganie gumy z góry, chwyt neutralny', 2, 8, 12, {mode: 'fail', rest: 150, tip: 'Inny kąt niż w Górze A. Seria 1 z zapasem 1–2 powtórzeń, ostatnia do upadku.', yt: ['lat+pulldown+v-bar+chwyt+neutralny+technika']}),
    E('gB4', 'Unoszenie bokiem (maszyna / wyciąg dolny jednorącz)', 'Unoszenie hantli bokiem', 3, 12, 15, {yt: ['unoszenie+ramion+bokiem+maszyna+technika', 'unoszenie+bokiem+wyciag+dolny+jednoracz']}),
    E('gB5', 'Face pull na wyciągu (lina)', 'Face pull z gumą', 2, 12, 15, {yt: ['face+pull+wyciag+lina+technika']}),
    E('gB6', 'Rozpiętki na butterfly (pec deck)', 'Rozpiętki z hantlami', 2, 12, 15, {yt: ['butterfly+pec+deck+technika']}),
    E('gB7', 'Uginanie młotkowe z liną na wyciągu dolnym', 'Uginanie młotkowe z hantlami', 2, 10, 12, {yt: ['uginanie+mlotkowe+lina+wyciag+dolny+technika']}),
    E('gB8', 'Dipy na maszynie z odciążeniem / triceps na wyciągu', 'Dipy / pompki wąskie', 2, 10, 12, {yt: ['maszyna+do+dipow+technika']}),
    E('robak', 'Martwy robak (na stronę)', 'Martwy robak (na stronę)', 2, 10, 12, {noW: true, rest: 60, tip: 'Lędźwie przy podłodze, ruch powoli. Jeśli plecy odrywają się od podłoża, skróć ruch.', yt: ['dead+bug+technika']}),
    E('pallof', 'Pallof press na wyciągu (na stronę)', 'Pallof press z gumą', 3, 10, 12, {rest: 60, tip: 'Antyrotacja: tułów się nie skręca. Ciężar dokładasz talerzem.', yt: ['pallof+press+wyciag+technika']}),
    E('sideplank', 'Side plank (sekundy na stronę)', 'Side plank', 2, 20, 30, {unit: 's', noW: true, rest: 60, tip: 'Ciało w jednej linii od głowy do stóp, biodro nie opada.', yt: ['side+plank+technika']})
  ]},
  dB: {name: 'Dół B', day: 5, ex: [
    E('dB1', 'Hip thrust (maszyna / smith), lżej', 'Hip thrust z hantlem (lżej)', 2, 12, 15, {mode: 'rir', rest: 120, tip: 'Lżej i więcej powtórzeń niż w Dole A. Miednica PODWINIĘTA.', yt: ['hip+thrust+maszyna+technika']}),
    E('legcurl', 'Uginanie nóg na maszynie siedząc', 'Unoszenie bioder jednonóż', 3, 12, 15, {tip: 'Siedząc, nie leżąc: leżąc łatwo wyginasz lędźwie.', yt: ['uginanie+nog+siedzac+maszyna+technika']}),
    E('dB3', 'Leg press lekki', 'Goblet squat lekki', 2, 12, 15, {mode: 'rir', rest: 120, tip: 'Miednica NIE odrywa się od oparcia. Zapas 1-2 powtórzeń.', yt: ['leg+press+technika']}),
    E('dB4', 'Hip abduction (maszyna)', 'Odwodzenie bioder z gumą', 3, 15, 20, {yt: ['hip+abduction+maszyna+technika']}),
    E('dB5', 'Łydki na maszynie siedząc', 'Wspięcia na palce na stopniu, z hantlem', 3, 12, 20, {tip: 'Pełny zakres, pauza na dole.', yt: ['lydki+siedzac+maszyna+technika']}),
    E('deadbug', 'Dead bug (martwy robak)', 'Dead bug', 3, 10, 12, {noW: true, rest: 60, tip: 'Lędźwie przy podłodze, ruch powoli.', yt: ['dead+bug+technika']})
  ]}
};
const DEFAULT_ORDER = ['gA', 'dA', 'gB', 'dB'];

/* ====== PARTIE MIĘŚNIOWE (1 = główna, 0.5 = pomocnicza) ======
   Zakresy to orientacyjne serie robocze na tydzień dla osoby trenującej rekreacyjnie. */
const MUSCLES = [['chest', 'Klatka', 10, 20], ['back', 'Plecy', 10, 20], ['delts', 'Barki', 8, 16], ['biceps', 'Biceps', 6, 14], ['triceps', 'Triceps', 6, 14], ['quads', 'Czworogłowe', 8, 18], ['hams', 'Dwugłowe uda', 6, 14], ['glutes', 'Pośladki', 6, 16], ['calves', 'Łydki', 6, 12], ['core', 'Brzuch / core', 6, 14]];
const MG_DEFAULT = {
  gA1: {chest: 1, triceps: .5, delts: .5}, gA2: {back: 1, biceps: .5}, gA3: {delts: 1, triceps: .5}, gA4: {back: 1, biceps: .5}, gA5: {biceps: 1}, gA6: {triceps: 1},
  robak: {core: 1}, pallof: {core: 1}, gA9: {core: 1}, deadbug: {core: 1}, sideplank: {core: 1},
  dA1: {quads: 1, glutes: .5}, dA2: {glutes: 1, hams: .5}, dA3: {quads: 1}, legcurl: {hams: 1},
  gB1: {chest: 1, delts: .5, triceps: .5}, gB2: {back: 1, biceps: .5}, gB3: {back: 1, biceps: .5}, gB4: {delts: 1}, gB5: {delts: 1}, gB6: {chest: 1}, gB7: {biceps: 1}, gB8: {triceps: 1, chest: .5},
  dB1: {glutes: 1, hams: .5}, dB3: {quads: 1, glutes: .5}, dB4: {glutes: 1}, dB5: {calves: 1}
};
const musclesOf = e => !e ? null : e.m ? e.m : (MG_DEFAULT[e.id] || null);

/* ====== PLAN UŻYTKOWNIKA (kopia domyślnego, zapisana w telefonie po pierwszej zmianie) ====== */
const DAYS = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];
const PLAN_KEY = 'training.plan.v1';
const clone = o => JSON.parse(JSON.stringify(o));
let PLAN, ORDER, planCustom = false;
function validPlan(p) { return !!(p && p.sessions && Array.isArray(p.order) && p.order.every(k => p.sessions[k] && Array.isArray(p.sessions[k].ex))); }
function loadPlan() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PLAN_KEY)); } catch (e) {}
  if (validPlan(p)) { PLAN = p.sessions; ORDER = p.order; planCustom = true; }
  else { PLAN = clone(DEFAULT_PLAN); ORDER = DEFAULT_ORDER.slice(); planCustom = false; }
}
function savePlan() { try { localStorage.setItem(PLAN_KEY, JSON.stringify({version: 1, order: ORDER, sessions: PLAN})); planCustom = true; } catch (e) { toast('Nie udało się zapisać planu'); } }
function resetPlan() { localStorage.removeItem(PLAN_KEY); loadPlan(); }
const dayLabel = S => S.day == null || S.day === '' ? 'bez stałego dnia' : DAYS[S.day];
loadPlan();

/* ====== STAN I ZAPIS (lokalnie w telefonie) ====== */
const STORE_KEY = 'training.v1', DRAFT_KEY = 'training.draft.v1', MODE_KEY = 'training.mode', SET_KEY = 'training.settings';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
let db = Object.assign({workouts: [], water: {}, weights: {}, waterGoal: 2500, lastBackup: null, sinceBackup: 0}, load(STORE_KEY, {}));
let draft = load(DRAFT_KEY, null);
let settings = Object.assign({inc: 2.5, autoRest: true, wake: true, deload: null, deloadSnooze: null}, load(SET_KEY, {}));

/* ====== LOGIKA ====== */
// Ćwiczenie szukamy po ID (nie po kolejności), więc zmiany w planie nie psują historii.
function findIn(P, sess, id) {
  if (P[sess]) { const e = P[sess].ex.find(e => e.id === id); if (e) return e; }
  for (const k in P) { const e = P[k].ex.find(e => e.id === id); if (e) return e; }
  return null;
}
function exDef(sess, x) {
  const cur = findIn(PLAN, sess, x.id); if (cur) return cur;
  const d = findIn(DEFAULT_PLAN, sess, x.id);
  const base = d || E(x.id, x.n || x.id, x.h || '', (x.reps || []).length || 3, 8, 12);
  return x.n ? Object.assign({}, base, {n: x.n, h: x.h || ''}) : base;
}
const nameOf = (e, m) => m === 'home' ? (e.h || e.n) : e.n;
const exName = (sess, x, m) => nameOf(exDef(sess, x), m);
const sessName = w => PLAN[w.session] ? PLAN[w.session].name : (w.sessionName || (DEFAULT_PLAN[w.session] && DEFAULT_PLAN[w.session].name) || w.session);
const hasData = x => x && (x.w !== '' || x.reps.some(r => r !== ''));
const num = v => v === '' || v == null ? NaN : +String(v).replace(',', '.');
function sortedWorkouts() { return db.workouts.slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)); }
function lastFor(exId) {
  // treningi deload pomijamy: po lżejszym tygodniu cel liczy się od ostatniego normalnego treningu
  for (const w of sortedWorkouts()) { if ((draft && w.id === draft.id) || w.deload) continue; const x = w.ex.find(e => e.id === exId && hasData(e)); if (x) return {date: w.date, w: x.w, reps: x.reps}; }
  return null;
}
// Szacowany ciężar maksymalny (wzór Epleya) — do porównywania serii o różnej liczbie powtórzeń.
const e1rm = (w, r) => r > 0 ? w * (1 + r / 30) : 0;
function bestOf(x, noW) {
  const reps = x.reps.map(num).filter(r => r > 0);
  if (!reps.length) return 0;
  if (noW) return Math.max(...reps);
  const w = num(x.w);
  return w > 0 ? Math.max(...reps.map(r => e1rm(w, r))) : 0;
}
function recordFor(exId, noW, skipId) {
  let best = 0;
  for (const w of db.workouts) { if (w.id === skipId) continue; for (const x of w.ex) if (x.id === exId) best = Math.max(best, bestOf(x, noW)); }
  return best;
}
function hintFor(e, x) {
  if (!x.reps.length || !x.reps.every(r => r !== '' && !isNaN(+r))) return null;
  if (draft && draft.deload) return {c: 'rep', t: 'DELOAD: bez progresji. Po tym tygodniu wracasz do ostatnich ciężarów.'};
  const ok = x.reps.filter(r => +r >= e.r[1]).length >= x.reps.length;
  if (e.noW) return ok ? {c: 'up', t: 'GOTOWE: zwiększ zakres albo trudniejsza wersja'} : {c: 'rep', t: 'POWTÓRZ: dobij do ' + e.r[1] + ' ' + e.unit + ' we wszystkich seriach'};
  return ok ? {c: 'up', t: 'DODAJ CIĘŻAR: następnym razem +' + fmtKg(settings.inc) + ' kg i wróć do ' + e.r[0] + ' powt.'} : {c: 'rep', t: 'POWTÓRZ CIĘŻAR: dobij do ' + e.r[1] + ' ' + e.unit + ' we wszystkich seriach'};
}
// Cel na dziś na podstawie ostatniego treningu (podwójna progresja).
// Zwraca {t: tekst HTML, w: proponowany ciężar albo null}. Uwzględnia deload i ból pleców.
function goalFor(e, last, ctx = {}) {
  if (!last) return null;
  const reps = last.reps.map(num).filter(r => !isNaN(r));
  if (!reps.length) return null;
  const allTop = reps.length >= e.s && reps.every(r => r >= e.r[1]);
  const w = num(last.w), inc = settings.inc || 2.5;
  if (ctx.deload) {
    if (e.noW || !(w > 0)) return {t: 'Deload: łatwiejsza wersja, zapas 3 ' + (e.unit === 's' ? 'sekund' : 'powt.') + ', bez upadku', w: null};
    const d = roundTo(w * 0.85, inc);
    return {t: 'Deload: <b>' + fmtKg(d) + ' kg</b> (~85%), ' + e.r[0] + ' powt. z zapasem 3, bez upadku', w: d};
  }
  if (ctx.pain >= 5) {
    if (e.noW || !(w > 0)) return {t: 'Plecy: dziś lżej, krótszy zakres, zero bólu w trakcie', w: null};
    const d = roundTo(w * 0.8, inc);
    return {t: 'Plecy: dziś lżej, <b>' + fmtKg(d) + ' kg</b> (~80%), zapas 2–3 powt.', w: d};
  }
  if (e.noW || !(w > 0)) return {t: allTop ? 'Cel: trudniejsza wersja albo dłużej niż ' + e.r[1] + ' ' + esc(e.unit) : 'Cel: o 1 ' + (e.unit === 's' ? 'sekundę' : 'powtórzenie') + ' więcej niż ostatnio w każdej serii (max ' + e.r[1] + ')', w: null};
  if (allTop) return {t: 'Cel: <b>' + fmtKg(w + inc) + ' kg</b>, ' + e.r[0] + '+ powt.', w: Math.round((w + inc) * 100) / 100};
  return {t: 'Cel: <b>' + fmtKg(w) + ' kg</b>, o 1 powt. więcej niż ostatnio (' + reps.join(', ') + ')', w};
}

/* ====== OBJĘTOŚĆ, STAGNACJA, DELOAD, OBCIĄŻENIE ====== */
const setCount = x => x.reps.filter(r => r !== '').length;
function setsByMuscle(workouts) {
  const r = {}; let untagged = 0;
  for (const w of workouts) for (const x of w.ex) {
    const n = setCount(x); if (!n) continue;
    const m = musclesOf(exDef(w.session, x));
    if (!m || !Object.keys(m).length) { untagged += n; continue; }
    for (const k in m) r[k] = (r[k] || 0) + n * m[k];
  }
  return {r, untagged};
}
function planSetsByMuscle() {
  const r = {};
  for (const k of ORDER) for (const e of PLAN[k].ex) { const m = musclesOf(e); if (m) for (const g in m) r[g] = (r[g] || 0) + e.s * m[g]; }
  return r;
}
function workoutsIn(a, b) { return db.workouts.filter(w => w.date >= a && w.date < b && w.ex.some(hasData)); }
function weeksBack(n) { const ws0 = dateStr(weekStart()), out = []; for (let i = n - 1; i >= 0; i--) { const a = addDays(ws0, -7 * i); out.push({a, b: addDays(a, 7), l: fmtShort(a)}); } return out; }
function tonnage(w) {
  let t = 0;
  for (const x of w.ex) { const e = exDef(w.session, x), kg = num(x.w); if (e.noW || !(kg > 0)) continue; t += kg * x.reps.map(num).filter(r => r > 0).reduce((a, b) => a + b, 0); }
  return t;
}
const sessLoad = w => w.rpe > 0 && minutes(w) > 0 ? w.rpe * minutes(w) : 0;
const inDeload = () => { const d = settings.deload, t = todayStr(); return !!(d && t >= d.from && t <= d.to); };
const deloadEnded = () => settings.deload && !inDeload() && todayStr() > settings.deload.to ? settings.deload.to : null;
// Najlepsze wyniki z kolejnych treningów (bez deloadu, od końca ostatniego deloadu).
function exSeries(exId, noW) {
  const since = deloadEnded() || '';
  return db.workouts.filter(w => !w.deload && w.date > since && !(draft && w.id === draft.id)).sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id))
    .map(w => { const x = w.ex.find(e => e.id === exId && hasData(e)); return x ? bestOf(x, noW) : 0; }).filter(v => v > 0);
}
// Stagnacja: 3 ostatnie treningi tego ćwiczenia bez poprawy względem wcześniejszego najlepszego wyniku.
function isStalled(exId, noW) {
  const v = exSeries(exId, noW); if (v.length < 4) return false;
  return Math.max(...v.slice(-3)) <= Math.max(...v.slice(0, -3)) + 1e-9;
}
function stalledList() {
  const seen = new Set(), out = [];
  for (const k of ORDER) for (const e of PLAN[k].ex) { if (seen.has(e.id)) continue; seen.add(e.id); if (isStalled(e.id, e.noW)) out.push(e); }
  return out;
}
// Tygodnie z rzędu z treningiem (bieżący tydzień może być jeszcze pusty).
function trainingStreak(since) {
  const done = db.workouts.filter(w => w.ex.some(hasData));
  let streak = 0, a = dateStr(weekStart());
  for (let i = 0; i < 520; i++) {
    const b = addDays(a, 7);
    if (since && b <= since) break;
    if (done.some(w => w.date >= a && w.date < b)) streak++; else if (i > 0) break;
    a = addDays(a, -7);
  }

}
function deloadAdvice() {

  if (settings.deloadSnooze && todayStr() < settings.deloadSnooze) return null;
  const weeks = trainingStreak(settings.deload ? settings.deload.to : null), st = stalledList().length;
  if (weeks >= 7) return 'Trenujesz ' + weeks + ' tygodni z rzędu bez lżejszego tygodnia.';
  if (st >= 3) return 'Stoisz w miejscu w ' + st + ' ćwiczeniach.';

}
// Ból rośnie: średnia z 3 ostatnich treningów wyższa o 1,5+ niż z 3 wcześniejszych.
function painTrend() {
  const p = sortedWorkouts().filter(w => w.pain != null).slice(0, 6).map(w => w.pain);
  if (p.length < 5) return null;
  const a = avgOf(p.slice(0, 3)), b = avgOf(p.slice(3));
  return a >= 3 && a - b >= 1.5 ? a : null;
}
function painAdvice(p) {
  if (p == null || p <= 2) return '';
  if (p <= 4) return '<div class="banner" style="margin:10px 0 0">Umiarkowany dyskomfort: dziś zapas 2–3 powtórzeń, bez serii do upadku. Pomiń ćwiczenie, które nasila ból.</div>';
  return '<div class="banner bad" style="margin:10px 0 0"><b>Silny ból:</b> cele poniżej obniżone o ~20%. Rozważ tylko spacer i lekkie core. <b>Ból promieniujący do nogi, drętwienie, mrowienie albo osłabienie nogi = przerwij trening i skonsultuj się z fizjoterapeutą lub lekarzem.</b></div>';
}
const roundTo = (v, s) => Math.max(s, Math.round(v / s) * s);
function warmupFor(w) {
  if (!(w > 0)) return null;

}
function lastDone(sess) { const w = sortedWorkouts().find(w => w.session === sess); return w ? w.date : null; }
function suggested() { const d = new Date().getDay(); return ORDER.find(k => PLAN[k].day === d) || null; }

}

}
const minutes = w => w.start && w.end ? Math.round((new Date(w.end) - new Date(w.start)) / 60000) : null;

/* ====== EKRAN NIE GAŚNIE W TRAKCIE TRENINGU ====== */
let wakeLock = null;
async function wake() {
  if (!settings.wake || !draft || draft.done || wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { wakeLock = null; }
}
function unwake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }

/* ====== TIMER PRZERWY ====== */
let timerInt = null;
function startTimer(sec) {
  timer = {end: Date.now() + sec * 1000};
  clearInterval(timerInt); timerInt = setInterval(tickTimer, 250); tickTimer();
}
function stopTimer() { timer = null; clearInterval(timerInt); timerInt = null; $('#timerbox').innerHTML = ''; document.body.classList.remove('withtimer'); }
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .2; o.start(); setTimeout(() => { o.stop(); c.close(); }, 450); } catch (e) {} if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }
function tickTimer() {
  if (!timer) return;
  const left = Math.max(0, Math.round((timer.end - Date.now()) / 1000));
  if (left === 0) { beep(); toast('Koniec przerwy'); stopTimer(); return; }
  document.body.classList.add('withtimer');
  $('#timerbox').innerHTML = '<div class="timer"><b>' + Math.floor(left / 60) + ':' + pad(left % 60) + '</b><span class="small grow">przerwa</span><button class="sm" data-act="tadd">+30 s</button><button class="sm" data-act="tstop">Stop</button></div>';
}

function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }

  }

}

  const ok = await shareOrDownload(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}), 'training-kopia-' + todayStr() + '.json', 'application/json');
  if (ok) { db.lastBackup = new Date().toISOString(); db.sinceBackup = 0; saveDb(); toast('Kopia zapisana. Wybierz Pliki / iCloud Drive.'); render(); }
}
async function exportCsv() {

  const sIdx = [...Array(maxS).keys()];

  }
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  await shareOrDownload(new Blob([csv], {type: 'text/csv'}), 'training-historia-' + todayStr() + '.csv', 'text/csv');
}
function importJson(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data || !data.db || !Array.isArray(data.db.workouts)) throw new Error('zły plik');
      if (!confirm('Scalić kopię z obecnymi danymi? (Treningi o tym samym ID zostaną zastąpione, nic nie zostanie usunięte.)')) return;
      const ids = new Set(data.db.workouts.map(w => w.id));
      db.workouts = db.workouts.filter(w => !ids.has(w.id)).concat(data.db.workouts);
      db.water = Object.assign({}, data.db.water || {}, db.water);
      db.weights = Object.assign({}, data.db.weights || {}, db.weights);
      saveDb();
      if (validPlan(data.plan) && confirm('Kopia zawiera też Twój plan treningowy. Wczytać go? (zastąpi obecny plan)')) { PLAN = clone(data.plan.sessions); ORDER = data.plan.order.slice(); savePlan(); }

function backupNeeded() {
  if (!db.workouts.length) return false;
  if (!db.lastBackup) return true;

/* ====== WYKRESY (SVG) ====== */
function lineChart(pts, unit, opts = {}) {
  if (pts.length < 2) return '<p class="small">Wykres pojawi się po co najmniej dwóch pomiarach.</p>';
  const W = 340, H = 150, L = 34, R = 8, T = 10, B = 22;
  const ys = pts.map(p => p.y).concat(opts.extra ? opts.extra.map(p => p.y) : []);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const padY = (hi - lo) * 0.12; lo -= padY; hi += padY;
  if (opts.min != null) lo = Math.max(opts.min, lo);
  if (opts.max != null) hi = Math.min(opts.max, hi);
  const t0 = new Date(pts[0].x).getTime(), t1 = new Date(pts[pts.length - 1].x).getTime() || t0 + 1;
  const X = x => L + (W - L - R) * ((new Date(x).getTime() - t0) / Math.max(1, t1 - t0));
  const Y = y => T + (H - T - B) * (1 - (y - lo) / (hi - lo));

  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';

  const t = ev.target;
  if (t.dataset && t.dataset.pf) { planInput(t); return; }
  if (t.dataset && t.dataset.st) { const k = t.dataset.st; if (k === 'inc') { const v = num(t.value); if (v > 0 && v <= 50) settings.inc = v; else t.value = fmtKg(settings.inc); } else settings[k] = t.checked; saveSettings(); if (k === 'wake') { if (t.checked) wake(); else unwake(); } return; }
  if (t.id === 'statEx') { statEx = t.value; render(); return; }
  // po wpisaniu serii: sam włącza przerwę
  if (draft && !draft.done && t.dataset.k === 'r' && t.value !== '' && settings.autoRest) { const e = exDef(draft.session, draft.ex[+t.dataset.i]); startTimer(e.rest); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.pf) { planInput(t); return; }
  if (t.dataset.st) return;
  if (t.id === 'dDate') { if (t.value) { draft.date = t.value; saveDraft(); } return; }
  if (t.id === 'dNote') { draft.note = t.value; saveDraft(); return; }
  if (t.id === 'goal') { const v = parseInt(t.value, 10); if (v > 0) { db.waterGoal = v; saveDb(); } return; }
  if (!draft || t.dataset.i == null) return;
  const i = +t.dataset.i, x = draft.ex[i], k = t.dataset.k;
  if (k === 'w') x.w = t.value.replace(',', '.');
  else if (k === 'r') x.reps[+t.dataset.s] = t.value.replace(/[^0-9]/g, '');
  else if (k === 'note') x.note = t.value;
  if (k === 'w' || k === 'r') checkPr(i);
  saveDraft(); updHint(i);
  const sv = $('#saved'); if (sv) { sv.textContent = '✓ Zapisano ' + new Date().toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit', second: '2-digit'}); }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (b.disabled) return;
  if (/^p(s|e|back|exback|reset|mg)/.test(a)) { planClick(a, b); return; }
  switch (a) {
    case 'tab': tab = v; planSess = null; planEx = null; summary = null; render(); window.scrollTo(0, 0); break;
    case 'pain': draft.pain = draft.pain === +v ? null : +v; saveDraft(); render(); break;
    case 'rpe': draft.rpe = draft.rpe === +v ? null : +v; saveDraft(); render(); break;
    case 'fillw': { const i = +b.dataset.i; draft.ex[i].w = v; checkPr(i); saveDraft(); render(); const el = $('#c-' + i + ' input[data-k="r"]'); if (el) el.focus(); break; }
    case 'sumok': summary = null; render(); break;
    case 'dlstart': settings.deload = {from: todayStr(), to: addDays(todayStr(), 6)}; saveSettings(); toast('Deload do ' + fmtDate(settings.deload.to)); render(); break;
    case 'dlend': if (settings.deload) { settings.deload.to = addDays(todayStr(), -1); settings.deloadSnooze = null; saveSettings(); render(); } break;
    case 'dlsnooze': settings.deloadSnooze = addDays(todayStr(), 7); saveSettings(); render(); break;
    case 'mode': mode = v; localStorage.setItem(MODE_KEY, v); render(); break;
    case 'dmode': draft.mode = v; saveDraft(); render(); break;
    case 'start': startWorkout(v); window.scrollTo(0, 0); break;
    case 'drop': dropDraft(); break;
    case 'finish': finishWorkout(); break;
    case 'tip': { const el = $('#tip-' + b.dataset.i); el.classList.toggle('hidden'); break; }
    case 'warm': showWarmup(+b.dataset.i); break;
    case 'addset': { const i = +b.dataset.i, x = draft.ex[i]; if (x.reps.length >= 8) { toast('Maksymalnie 8 serii'); break; } x.reps.push(''); saveDraft(); render(); const el = $('#c-' + i); if (el) el.scrollIntoView({block: 'center'}); break; }
    case 'timer': startTimer(+v); break;
    case 'tadd': if (timer) { timer.end += 30000; tickTimer(); } break;
    case 'tstop': stopTimer(); break;
    case 'open': $('#h-' + v).classList.toggle('hidden'); break;
    case 'edit': { const w = db.workouts.find(w => w.id === v); if (w) { draft = clone(w); draft.done = true; saveDraft(); tab = 'train'; render(); window.scrollTo(0, 0); } break; }
    case 'del': if (confirm('Usunąć ten trening?')) { db.workouts = db.workouts.filter(w => w.id !== v); saveDb(); render(); } break;
    case 'water': { const t = todayStr(); db.water[t] = Math.max(0, (db.water[t] || 0) + (+v)); saveDb(); render(); break; }
    case 'bw': { const val = ($('#bw').value || '').replace(',', '.'); if (val && !isNaN(+val) && +val > 0) { db.weights[todayStr()] = val; saveDb(); toast('Zapisano wagę'); render(); } break; }
    case 'bwdel': if (confirm('Usunąć wagę z ' + fmtDate(v) + '?')) { delete db.weights[v]; saveDb(); render(); } break;
    case 'exj': exportJson(); break;
    case 'exc': exportCsv(); break;
  }
});
/* ====== START ====== */
render();
if (draft && !draft.done) wake();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(r => { persisted = r; if (tab === 'bak') render(); }).catch(() => { persisted = false; });
else persisted = false;
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
